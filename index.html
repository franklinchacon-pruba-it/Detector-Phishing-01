<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificador de Documento</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/image.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: #f5f5f5;
        }
        #image-container {
            margin: 20px auto;
            max-width: 600px;
        }
        img {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        #label-container {
            margin-top: 20px;
            font-size: 18px;
        }
        input[type="file"], button {
            margin: 10px;
            padding: 10px 16px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Clasificador de Documento</h1>

    <input type="file" id="file-input" accept="image/*" />
    <button type="button" id="predict-btn">Analizar documento</button>

    <div id="image-container"></div>
    <div id="label-container"></div>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/KMuZhdm1q/";

        let model, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";

            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function predictImage(imgElement) {
            if (!model) {
                await init();
            }

            const prediction = await model.predict(imgElement);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(2) + "%";
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }

        document.getElementById("file-input").addEventListener("change", function (event) {
            const file = event.target.files[0];
            if (!file) return;

            const img = document.createElement("img");
            const objectURL = URL.createObjectURL(file);
            img.src = objectURL;
            img.onload = () => {
                document.getElementById("image-container").innerHTML = "";
                document.getElementById("image-container").appendChild(img);
                predictImage(img);
            };
        });

        document.getElementById("predict-btn").addEventListener("click", function () {
            const fileInput = document.getElementById("file-input");
            const file = fileInput.files[0];

            if (!file) {
                alert("Primero selecciona una imagen del documento.");
                return;
            }

            const img = document.createElement("img");
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                document.getElementById("image-container").innerHTML = "";
                document.getElementById("image-container").appendChild(img);
                predictImage(img);
            };
        });

        init();
    </script>
</body>
</html>
