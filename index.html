<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detector de phishing</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/image.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f5f5f5; color: #000; }
        h1 { margin-bottom: 25px; }
        #image-container { margin: 20px auto; max-width: 600px; min-height: 20px; }
        #image-container img { max-width: 100%; max-height: 450px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
        #label-container { margin-top: 20px; font-size: 18px; line-height: 1.8; }
        #status { margin: 15px 0; font-weight: bold; }
        input[type="file"], button { margin: 10px; padding: 10px 16px; font-size: 16px; border-radius: 6px; }
        input[type="file"] { border: 1px solid #ccc; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover:not(:disabled) { background: #0056b3; }
        button:disabled { background: #8bbcf0; cursor: not-allowed; }
        .error { color: #b00020; }
        .resultado { background: white; max-width: 500px; margin: 8px auto; padding: 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.15); }
        #canvas { display: none; }
    </style>
</head>
<body>
    <h1>Detector de phishing</h1>
    <input type="file" id="file-input" accept="image/png, image/jpeg, image/jpg, image/webp">
    <br>
    <button type="button" id="predict-btn" disabled>Analizar documento</button>
    <p id="status">Cargando modelo...</p>
    <div id="image-container"></div>
    <canvas id="canvas" width="224" height="224"></canvas>
    <div id="label-container"></div>

    <script>
        const MODEL_URL = "https://teachablemachine.withgoogle.com/models/Q4JX7qTqd/";
        const fileInput = document.getElementById("file-input");
        const predictButton = document.getElementById("predict-btn");
        const imageContainer = document.getElementById("image-container");
        const labelContainer = document.getElementById("label-container");
        const status = document.getElementById("status");
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let model = null;
        let selectedImage = null;
        let modelReady = false;
        let currentObjectURL = null;

        function showError(message) {
            status.textContent = message;
            status.classList.add("error");
        }

        function updateButton() {
            predictButton.disabled = !(modelReady && selectedImage);
        }

        async function init() {
            try {
                if (typeof tf === "undefined") throw new Error("TensorFlow.js no se cargó");
                if (typeof tmImage === "undefined") throw new Error("Teachable Machine no se cargó");

                status.textContent = "Cargando modelo de inteligencia artificial...";
                model = await tmImage.load(`${MODEL_URL}model.json`, `${MODEL_URL}metadata.json`);
                modelReady = true;
                status.classList.remove("error");
                status.textContent = selectedImage
                    ? "Modelo listo. Pulsa Analizar documento."
                    : "Modelo listo. Selecciona una imagen.";
                updateButton();
            } catch (error) {
                console.error("No se pudo cargar el modelo:", error);
                showError("No se pudo cargar el modelo. Verifica la URL y tu conexión a Internet.");
                updateButton();
            }
        }

        async function predictImage() {
            if (!modelReady || !model || !selectedImage) {
                showError("Espera a que cargue el modelo y selecciona una imagen.");
                return;
            }

            predictButton.disabled = true;
            status.classList.remove("error");
            status.textContent = "Analizando imagen...";
            labelContainer.replaceChildren();

            try {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(selectedImage, 0, 0, canvas.width, canvas.height);
                const prediction = await model.predict(canvas);
                prediction.sort((a, b) => b.probability - a.probability);

                prediction.forEach(result => {
                    const resultElement = document.createElement("div");
                    resultElement.className = "resultado";
                    resultElement.textContent = `${result.className}: ${(result.probability * 100).toFixed(2)}%`;
                    labelContainer.appendChild(resultElement);
                });

                const best = prediction[0];
                status.textContent = `Resultado principal: ${best.className} (${(best.probability * 100).toFixed(2)}%)`;
            } catch (error) {
                console.error("Error al analizar la imagen:", error);
                showError(`No se pudo analizar la imagen: ${error.message}`);
            } finally {
                updateButton();
            }
        }

        fileInput.addEventListener("change", event => {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith("image/")) {
                selectedImage = null;
                imageContainer.replaceChildren();
                updateButton();
                showError("Selecciona un archivo de imagen válido.");
                return;
            }

            if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
            currentObjectURL = URL.createObjectURL(file);
            selectedImage = null;
            labelContainer.replaceChildren();
            status.classList.remove("error");

            const image = document.createElement("img");
            image.alt = "Vista previa del documento";
            image.onload = () => {
                selectedImage = image;
                imageContainer.replaceChildren(image);
                status.textContent = modelReady
                    ? "Imagen cargada. Pulsa Analizar documento."
                    : "Imagen cargada. Esperando el modelo...";
                updateButton();
            };
            image.onerror = () => {
                selectedImage = null;
                imageContainer.replaceChildren();
                updateButton();
                showError("No se pudo leer la imagen seleccionada.");
            };
            image.src = currentObjectURL;
        });

        predictButton.addEventListener("click", predictImage);
        init();
    </script>
</body>
</html>
